[project]
name = "autotune"
version = "0.1.0"
description = "A research loop that finds the fastest training config for given hardware."
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.2",          # only needed to CAPTURE a profile; roofline/trace/diagnostic are pure-python
    "psutil>=5.9",         # CPU-util sampling during capture (lazily imported; optional at runtime)
    "transformers>=4.40",  # frame: HF AutoConfig/AutoTokenizer (model internals, tokenization)
    "datasets>=2.19",      # frame: streaming dataset scan for the length distribution
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8",
]

[tool.uv]
# uv manages the venv (.venv) and the pinned Python (see .python-version).
