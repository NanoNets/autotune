model_name: HuggingFaceTB/SmolLM2-360M
attn_implementation: sdpa
training:
  output_dir: /tmp/byo_trainer_yaml
  max_steps: 100
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-4
  bf16: true
  optim: adamw_torch
  gradient_checkpointing: false
  seed: 42
  logging_steps: 10
  save_strategy: "no"
  report_to: none
  disable_tqdm: true
